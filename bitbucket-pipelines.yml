  schedules:
    - cron: "0 8 * * 1"
      step:
        name: "Weekly dependency report"
        image: php:8.3-cli
        caches:
          - npm-cache
          - composer-cache
        script:
          - export COMPOSER_ALLOW_SUPERUSER=1

          # Install system dependencies
          - apt-get update && apt-get install -y git unzip curl libzip-dev libpng-dev libjpeg-dev libfreetype-dev libicu-dev
          - docker-php-ext-configure gd --with-freetype --with-jpeg
          - docker-php-ext-install zip gd intl pdo_mysql
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

          # Install Node.js 20
          - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          - apt-get install -y nodejs

          - npm install --ignore-scripts
          - echo "=== npm outdated ==="
          - npm outdated || true
          - echo "=== composer outdated ==="
          - composer install --no-interaction --no-progress --ignore-platform-req=php 2>/dev/null || true
          - composer outdated --direct || true
