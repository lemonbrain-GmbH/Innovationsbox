name: Deploy Storybook

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - run: npm ci

      - name: Build design tokens
        run: npm run tokens

      - name: Pre-render component stories
        run: |
          php -S 0.0.0.0:6007 storybook-server/index.php &
          sleep 2
          node scripts/prerender-stories.mjs

      - name: Build Storybook
        run: npm run storybook:build

      - name: Bundle pre-rendered data
        run: cp .storybook/prerendered.json storybook-static/prerendered.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
